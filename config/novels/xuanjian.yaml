entity_types:
  人物:
    fields: [所属势力, 境界, 简介]
  势力:
    fields: [层级, 立场, 首领, 简介]
    description: 势力/组织/地理单位。同一势力的不同称谓（如"李家"与"黎泾李家"、"青池宗"与"青池"）是同一实体，必须归并：用最常用的名字做 name，其余全称/简称/别称都放进 aliases。
  仙基:
    classify_by: [五行, 品阶, 传承]
    fields: [作用, 修炼者, 副作用]
    description: 筑基修士凝结的道基（原文"练气化筑基最关键一步便是化去六轮，凝结为种种道基"），如湖月秋、浩瀚海、应帝王、白玉盘。胎息期的轮、修炼功法、气类物品、小术法都不是仙基。
  轮:
    classify_by: [五行, 品阶, 传承]
    fields: [作用, 修炼者, 副作用]
    description: 胎息期修成的轮，名字以"轮"结尾——灵初轮、承明轮、周行轮、青元轮、玄景轮、玉京轮六轮及功法变体（上琅灵轮、太阴六轮、白玉六轮等）。胎息六轮养至满月入练气，筑基时化去六轮凝结为仙基。修炼功法（养轮经/诀）不是轮本身。
  功法:
    classify_by: [五行, 品阶, 传承]
    fields: [作用, 修炼者, 副作用]
    description: 成体系的修炼方法典籍，名字常以诀/经/秘旨/法结尾（如天元练气诀、太阴吐纳养轮经、青元养轮法）。判断标准：是被长期诵习修炼的方法体系，不是施展一次的法术，也不是"轮"本身。
  术法:
    fields: [作用, 施展者, 消耗]
    description: 施展型的法术技能，名字常以术结尾（如净衣术、灵雨术、驱邪术），也包括避水法、灵中符法这类一次性施放的小法术。判断标准：用时施展、不用则已的技能。
  道具:
    classify_by: [品阶]
    fields: [类型, 作用, 当前持有者, 简介]
    description: 各种物品，包括灵物、符箓、丹药，以及突破用的气类灵物（如夜月凛气、太阴月华、太阴玄光、玄珠符种）。名字带气/月华/玄光且需采集服用的突破资源归道具，不是仙基也不是功法。品阶尽量从描述推断给出（蕴含灵气/修士争抢/法器符箓通常灵品，凡俗物件凡品，仙缘至宝仙品），实在无法判断才留空。
relation_types:
  - name: 所属
    from_type: 人物
    to_type: 势力
    description: 人物所属势力
  - name: 修炼
    from_type: 人物
    to_type: 功法
    description: 人物长期诵习某功法
  - name: 修成
    from_type: 人物
    to_type: 仙基
    description: 人物修成某轮（胎息轮）或筑基凝结某道基（仙基），如"李尺泾修成青元轮""李尺泾筑基修成湖月秋"
  - name: 施展
    from_type: 人物
    to_type: 术法
    description: 人物施展某术法
  - name: 持有
    from_type: 人物
    to_type: 道具
    description: 人物持有某道具
  - name: 关系
    from_type: 人物
    to_type: 人物
    description: 师徒/敌对/亲属/恋人/盟友等，写进 attrs
  - name: 克制
    from_type: 仙基
    to_type: 仙基
  - name: 势力关系
    from_type: 势力
    to_type: 势力
    description: 势力间关系，具体性质（结盟/附庸/联姻/敌对/贸易/雇佣/联防/决裂等，用规范短词）写进 attrs；同一对势力的关系随剧情变化时，也要抽取当前最新状态
classification_dimensions:
  五行: [金, 木, 水, 火, 土]
  品阶: [凡品, 灵品, 仙品]
  传承: [玄鉴仙族, 其他势力, 散修]
taxonomy_parents:
  五行:
    玄水: 水
    灵水: 水
